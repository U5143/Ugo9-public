<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-size: 12px; color: var(--uxp-host-text-color, #ddd); background: var(--uxp-host-background-color, #333); padding: 8px; margin: 0; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    button { font-size: 12px; padding: 4px 8px; }
    #status { margin-bottom: 6px; font-weight: bold; }
    .item { padding: 4px 6px; margin: 2px 0; border-left: 3px solid #888; line-height: 1.4; }
    .item.warn { border-color: #e0a030; }
    .item.info { border-color: #6aa0e0; }
    .item.link { cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="row">
    <button id="refresh">確かめ直す / Check again</button>
    <button id="underpaint">下塗りを足す / Add underpaint</button>
  </div>
  <div id="status"></div>
  <div id="items"></div>
  <script src="rules.js"></script>
  <script src="main.js"></script>
</body>
</html>
