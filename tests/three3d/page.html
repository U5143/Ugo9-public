<html lang="ja">
<head>
<meta charset="utf-8">
<title>Ugo9 three.js test</title>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<style>body { margin: 0; background: #fff; } canvas { display: inline-block; }</style>
</head>
<body>
<canvas id="three" width="420" height="600"></canvas><canvas id="ugo" width="420" height="600"></canvas>
<script type="module">
// Harness for tests/three3d_test.mjs: the same character drawn by UgoThreeCharacter in a
// three.js scene and by the Ugo9 2D renderer, plus 3D checks (billboard, occlusion).
import * as THREE from 'three';
import { UgoRuntime, UgoRenderer, loadImage } from '/web/ugo.js';
import { UgoThreeCharacterFactory } from '/web/ugo_three.js';

const BG = [0.95, 0.94, 0.92];
const rt = await UgoRuntime.load('/web/ugo.wasm');
const model = rt.loadModel(await (await fetch('/samples/basic/model.ug9')).arrayBuffer());
const [CW, CH, OX, OY] = model.canvas;
const atlas = await loadImage('/samples/basic/atlas.png');

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setClearColor(new THREE.Color().setRGB(...BG, THREE.SRGBColorSpace), 1);
const factory = new UgoThreeCharacterFactory(THREE, model, new THREE.Texture(atlas));
const scene = new THREE.Scene();
const ch = factory.create({ metresPerPixel: 0.01 });
scene.add(ch);

const gl2 = document.getElementById('ugo').getContext('webgl2', { antialias: true, preserveDrawingBuffer: true, alpha: false });
const ugoRenderer = new UgoRenderer(gl2, model, [atlas]);
const ref = model.createInstance();

const read = (gl, w, h) => { const px = new Uint8Array(w * h * 4); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px); return px; };
const pose = (inst, params) => { inst.reset(); for (const [k, v] of Object.entries(params)) inst.set(k, v); inst.update(0); };

// 1. front view, orthographic: must match the 2D renderer
window.compareFront = (params, flip = false) => {
  ch.ugo.material.uniforms.uBillboard.value = false;
  ch.position.set(0, 0, 0); ch.rotation.set(0, 0, 0); ch.scale.set(flip ? -1 : 1, 1, 1); // mirrored: every triangle is back-facing
  pose(ch.instance, params); ch.sync(renderer);
  const cam = new THREE.OrthographicCamera(-OX * 0.01, (CW - OX) * 0.01, OY * 0.01, -(CH - OY) * 0.01, -10, 10);
  renderer.render(scene, cam);
  pose(ref, params); ref.setTransform(flip ? -1 : 1, 0, 0, 1, OX, OY);
  gl2.viewport(0, 0, CW, CH); gl2.clearColor(...BG, 1); gl2.clear(gl2.COLOR_BUFFER_BIT);
  ugoRenderer.draw([ref], CW, CH, 'gpu');
  const a = read(renderer.getContext(), CW, CH), b = read(gl2, CW, CH);
  let max = 0, over = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
    if (d > max) max = d; if (d > 16) over++;
  }
  return { max, over16: over, pixels: a.length / 4 };
};

// 1b. another model (masks, blend modes, colours, extra weights, warp grids):
// three.js front view vs the 2D renderer, on canvases of the model's size
window.compareModel = async (url, params = {}, anim = '', time = 0, textures = true, sampling = 'linear', scale = 1) => {
  const m = rt.loadModel(await (await fetch(url)).arrayBuffer());
  const [W, H, ox, oy] = m.canvas;
  const white = () => createImageBitmap(new ImageData(new Uint8ClampedArray([255, 255, 255, 255]), 1, 1));
  const dir = url.slice(0, url.lastIndexOf('/') + 1);
  // textures = false: the model's texture files are not there (drawn white, as the renderers do without one)
  const images = await Promise.all((m.textures.length ? m.textures : ['']).map((t) => (t && textures ? loadImage(dir + t) : white())));
  // scale > 1 enlarges the model (nearest sampling shows its texels as blocks)
  const CW = Math.round(W * scale), CH = Math.round(H * scale);
  const c3 = Object.assign(document.createElement('canvas'), { width: CW, height: CH });
  const c2 = Object.assign(document.createElement('canvas'), { width: CW, height: CH });
  document.body.append(c3, c2);
  const r3 = new THREE.WebGLRenderer({ canvas: c3, antialias: true, preserveDrawingBuffer: true });
  r3.setPixelRatio(1);
  r3.setClearColor(new THREE.Color().setRGB(...BG, THREE.SRGBColorSpace), 1);
  const f = new UgoThreeCharacterFactory(THREE, m, images.map((im) => new THREE.Texture(im)), { sampling });
  const s3 = new THREE.Scene(), c = f.create({ metresPerPixel: 0.01 * scale });
  s3.add(c);
  const posed = (inst) => { inst.reset(); if (anim) inst.play(anim, time); for (const [k, v] of Object.entries(params)) inst.set(k, v); inst.update(0); };
  posed(c.instance); c.sync(r3);
  r3.render(s3, new THREE.OrthographicCamera(-ox * 0.01 * scale, (W - ox) * 0.01 * scale, oy * 0.01 * scale, -(H - oy) * 0.01 * scale, -10, 10));
  const g = c2.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true, alpha: false });
  const r2 = new UgoRenderer(g, m, images, { sampling }), inst = m.createInstance();
  posed(inst); inst.setTransform(scale, 0, 0, scale, ox * scale, oy * scale);
  g.viewport(0, 0, CW, CH); g.clearColor(...BG, 1); g.clear(g.COLOR_BUFFER_BIT);
  r2.draw([inst], CW, CH, 'gpu');
  const a = read(r3.getContext(), CW, CH), b = read(g, CW, CH);
  // free both contexts (a browser keeps only so many)
  r3.dispose(); r3.forceContextLoss(); g.getExtension('WEBGL_lose_context')?.loseContext(); c3.remove(); c2.remove();
  let max = 0, over24 = 0, drawn = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
    if (d > max) max = d; if (d > 24) over24++;
    if (Math.abs(b[i] - BG[0] * 255) + Math.abs(b[i + 1] - BG[1] * 255) + Math.abs(b[i + 2] - BG[2] * 255) > 6) drawn++;
  }
  return { max, over24, drawn, pixels: a.length / 4 };
};

// width of the drawn character in pixels (columns that differ from the background)
const drawnWidth = () => {
  const gl = renderer.getContext(), px = read(gl, CW, CH);
  let lo = CW, hi = -1;
  for (let y = 0; y < CH; y += 2) for (let x = 0; x < CW; x++) {
    const i = 4 * (y * CW + x);
    if (Math.abs(px[i] - 242) + Math.abs(px[i + 1] - 240) + Math.abs(px[i + 2] - 235) > 30) { lo = Math.min(lo, x); hi = Math.max(hi, x); }
  }
  return hi - lo;
};

// 2. a perspective camera looking from the side: billboarded characters keep their width
window.sideView = (billboard, angleDeg) => {
  ch.ugo.material.uniforms.uBillboard.value = billboard;
  ch.position.set(0, -3, 0); ch.rotation.set(0, 0, 0);
  pose(ch.instance, {}); ch.sync(renderer);
  const cam = new THREE.PerspectiveCamera(40, CW / CH, 0.1, 100);
  const a = (angleDeg * Math.PI) / 180;
  cam.position.set(Math.sin(a) * 12, 0, Math.cos(a) * 12);
  cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
  return drawnWidth();
};

// 3. a box in front of the character hides part of it (depth test against the scene)
window.occlusion = () => {
  ch.ugo.material.uniforms.uBillboard.value = false;
  ch.position.set(0, -3, 0);
  pose(ch.instance, {}); ch.sync(renderer);
  const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x2266cc }));
  box.position.set(0, 1.2, 2); // in front of the face
  scene.add(box);
  const cam = new THREE.PerspectiveCamera(40, CW / CH, 0.1, 100);
  cam.position.set(0, 0, 12); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
  const v = new THREE.Vector3(0, 1.2, 2).project(cam);
  const x = Math.round((v.x * 0.5 + 0.5) * CW), y = Math.round((v.y * 0.5 + 0.5) * CH);
  const px = new Uint8Array(4);
  renderer.getContext().readPixels(x, y, 1, 1, renderer.getContext().RGBA, renderer.getContext().UNSIGNED_BYTE, px);
  scene.remove(box);
  return Array.from(px);
};

// 4. the whole character's colour and opacity: [drawn pixels, greener or bluer than the background]
window.tint = (r, g, b, opacity) => {
  ch.ugo.material.uniforms.uBillboard.value = false;
  ch.position.set(0, 0, 0); ch.rotation.set(0, 0, 0); ch.scale.set(1, 1, 1);
  ch.color.setRGB(r, g, b); ch.opacity = opacity;
  pose(ch.instance, {}); ch.sync(renderer);
  const cam = new THREE.OrthographicCamera(-OX * 0.01, (CW - OX) * 0.01, OY * 0.01, -(CH - OY) * 0.01, -10, 10);
  renderer.render(scene, cam);
  ch.color.setRGB(1, 1, 1); ch.opacity = 1;
  const a = read(renderer.getContext(), CW, CH);
  const bgPx = [a[0], a[1], a[2]]; // the corner is background
  let drawn = 0, off = 0;
  for (let i = 0; i < a.length; i += 4) {
    if (Math.abs(a[i] - bgPx[0]) + Math.abs(a[i + 1] - bgPx[1]) + Math.abs(a[i + 2] - bgPx[2]) < 6) continue;
    drawn++;
    if (a[i + 1] > bgPx[1] + 3 || a[i + 2] > bgPx[2] + 3) off++;
  }
  return [drawn, off];
};

// 5. picking by part name: a ray from the camera through the face, front on and (billboarded) from the side
window.pick = () => {
  const out = [];
  for (const billboard of [false, true]) {
    ch.ugo.material.uniforms.uBillboard.value = billboard;
    ch.position.set(1, -2, 0); ch.rotation.set(0, billboard ? 0.9 : 0.3, 0); ch.scale.set(1.5, 1.5, 1.5);
    pose(ch.instance, {}); ch.sync(renderer);
    const cam = new THREE.PerspectiveCamera(40, CW / CH, 0.1, 100);
    cam.position.set(billboard ? 8 : 0, 1, 12); cam.lookAt(0, 0, 0); cam.updateMatrixWorld();
    // the face's middle (model (0, -330)) in the world: along the sheet, or along the camera's axes when billboarded
    const face = new THREE.Vector3();
    if (billboard) {
      const r = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), u = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
      face.copy(ch.position).addScaledVector(u, 3.3 * 1.5).addScaledVector(r, 0);
    } else {
      ch.updateMatrixWorld(); face.set(0, 3.3, 0).applyMatrix4(ch.matrixWorld);
    }
    const rc = new THREE.Raycaster();
    rc.setFromCamera(new THREE.Vector2().copy(face.clone().project(cam)), cam);
    const miss = new THREE.Raycaster();
    miss.setFromCamera(new THREE.Vector2(-0.99, 0.99), cam); // the top left corner: beside the character
    out.push([ch.partAt(rc), ch.partAt(miss)]);
  }
  ch.ugo.material.uniforms.uBillboard.value = false;
  ch.scale.set(1, 1, 1);
  const b = ch.partBounds('face');
  out.push(b && b[0] < 0 && b[2] > 0 && b[1] < -330 && b[3] > -330);
  return out;
};

window.ready = true;
</script>
</body>
</html>
