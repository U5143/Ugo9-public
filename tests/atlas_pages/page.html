<meta charset="utf-8"><title>atlas pages test</title>
<canvas id="c" width="448" height="448"></canvas>
<script type="module">
// A model whose parts take their pictures from three atlas pages of different sizes (256×200, 120×64, 48×48),
// in a draw order that goes back and forth between the pages. Drawn with UgoRenderer (WebGL2, one texture array)
// and UgoGPURenderer (WebGPU, one texture array), each compared with the C software renderer (one image per page).
import { UgoRuntime, UgoRenderer } from '/web/ugo.js';
import { UgoGPURenderer } from '/web/ugo_webgpu.js';
import { compileUgo } from '/tools/compile.mjs';
const W = 448, H = 448; // rows of 4 * 448 bytes: copyTextureToBuffer wants multiples of 256
const gl = document.getElementById('c').getContext('webgl2', { antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: true });
const rt = await UgoRuntime.load('/web/ugo.wasm');
const ex = rt.ex;
const adapter = await navigator.gpu?.requestAdapter();
const device = adapter && await adapter.requestDevice();
const gpuErrors = [];
if (device) device.addEventListener('uncapturederror', (e) => gpuErrors.push(e.error.message));

// smooth pages, each its own colours (a part reading the wrong page shows), some texels half transparent
const PAGES = [
  [256, 200, (x, y) => [x, Math.round(y * 255 / 199), 60, 255]],
  [117, 61, (x, y) => [30, 255 - 2 * x, 128 + 2 * y, y < 16 ? 140 : 255]],
  [45, 45, (x, y) => [180 + x, 40, 100 + 3 * y, 255]],
];
async function makePage([w, h, f]) {
  const rgba = new Uint8ClampedArray(4 * w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) rgba.set(f(x, y), 4 * (y * w + x));
  const c = new OffscreenCanvas(w, h);
  c.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0);
  // as loadImage() gives them: premultiplied
  return { rgba, image: await createImageBitmap(c, { premultiplyAlpha: 'premultiply', colorSpaceConversion: 'none' }) };
}
const pages = await Promise.all(PAGES.map(makePage));

const quad = (x, y, w, h, [u0, v0, u1, v1] = [0, 0, 1, 1]) => ({
  vertices: [x, y, x + w, y, x + w, y + h, x, y + h], uvs: [u0, v0, u1, v0, u1, v1, u0, v1], triangles: [0, 1, 2, 0, 2, 3] });
const model = rt.loadModel(compileUgo({
  format: 'ugo9', canvas: { width: 400, height: 400 },
  textures: ['page0.png', 'page1.png', 'page2.png'],
  bones: [{ id: 'root' }],
  parts: [ // back to front: pages 2, 0, 1, 2, 0, 1, overlapping
    { id: 'a', texture: 2, ...quad(10, 10, 120, 120) }, // magnified
    { id: 'b', texture: 0, ...quad(100, 20, 256, 200) }, // 1:1 over a
    { id: 'c', texture: 1, ...quad(30, 180, 120, 64) }, // over a and b, its top rows half transparent
    { id: 'd', texture: 2, ...quad(120, 200, 48, 48) }, // over b and c
    { id: 'e', texture: 0, ...quad(200, 190, 128, 100, [0.5, 0.5, 1, 1]) }, // the larger page's far corner
    { id: 'f', texture: 1, ...quad(40, 260, 90, 96, [0.75, 0.5, 1, 1]) }, // the smaller page's far corner (by the padding)
    { id: 'g', texture: 2, ...quad(800, 800, 64, 64) }, // the smallest page drawn small (only in the 'far edge' picture)
  ],
}));
const inst = model.createInstance();

// straight-alpha pixels for the C renderer: one UgoImage (pointer, width, height) per page
function cImages(list) {
  const img = rt.alloc(12 * list.length);
  list.forEach((p, i) => {
    const px = rt.alloc(p.rgba.length); rt.u8(px, p.rgba.length).set(p.rgba);
    rt.u32(img + 12 * i, 3).set([px, p.image.width, p.image.height]);
  });
  return img;
}
const cImg = cImages(pages);
const scratch = rt.alloc(8 * model.vertexCount + 8), target = rt.alloc(16 * W * H), maskBuf = rt.alloc(4 * W * H), view = rt.alloc(24);
rt.f32(view, 6).set([1, 0, 0, 1, 0, 0]);
function cPicture(nearest) { // premultiplied bytes, top-down
  rt.f32(target, 4 * W * H).fill(0);
  ex.ugo_raster_instance_ex(inst.ptr, cImg, pages.length, target, W, H, view, scratch, maskBuf, nearest ? 1 : 0);
  const f = rt.f32(target, 4 * W * H), out = new Uint8Array(4 * W * H);
  for (let i = 0; i < out.length; i++) out[i] = Math.round(Math.min(1, Math.max(0, f[i])) * 255);
  return out;
}
function glPicture(images, sampling) {
  const r = new UgoRenderer(gl, model, images, { sampling });
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  const st = r.draw([inst], W, H, 'gpu');
  const px = new Uint8Array(4 * W * H);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  r.dispose();
  const out = new Uint8Array(4 * W * H); // top-down
  for (let y = 0; y < H; y++) out.set(px.subarray(4 * (H - 1 - y) * W, 4 * (H - y) * W), 4 * y * W);
  return { px: out, draws: st.drawCalls };
}
async function gpuPicture(images, sampling) {
  const r = new UgoGPURenderer(device, null, model, images, { sampling, format: 'rgba8unorm' });
  const tex = device.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const st = r.draw([inst], W, H, 'gpu', tex.createView());
  const buf = device.createBuffer({ size: 4 * W * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  enc.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: 4 * W }, [W, H]);
  device.queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const px = new Uint8Array(buf.getMappedRange()).slice();
  buf.destroy(); tex.destroy(); r.dispose();
  return { px, draws: st.drawCalls };
}
// how far a GPU picture is from the C one: over all pixels, and inside the parts (pixels whose 3×3 neighbours in the
// C picture all have about their colour: not on an edge, where rasterisation rules and mipmaps differ)
function compare(a, c) {
  let max = 0, over = 0, painted = 0, innerMax = 0, inner = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = 4 * (y * W + x);
    if (a[i + 3] > 2 || c[i + 3] > 2) painted++;
    let d = 0;
    for (let k = 0; k < 4; k++) { const e = Math.abs(a[i + k] - c[i + k]); if (e > d) d = e; if (e > 24) over++; }
    if (d > max) max = d;
    let flat = y > 0 && x > 0 && y < H - 1 && x < W - 1 && c[i + 3] > 0;
    for (let dy = -1; dy <= 1 && flat; dy++) for (let dx = -1; dx <= 1 && flat; dx++) {
      const j = i + 4 * (dy * W + dx);
      for (let k = 0; k < 4; k++) if (Math.abs(c[j + k] - c[i + k]) > 12) flat = false;
    }
    if (flat) { inner++; if (d > innerMax) innerMax = d; }
  }
  return { max, over, painted, inner, innerMax };
}

window.run = async () => {
  const out = { webgpu: !!device }, images = pages.map((p) => p.image);
  const cases = [
    ['1:1', [1, 0, 0, 1, 20, 20], 'linear'],
    ['turned', [Math.cos(0.3) * 1.05, Math.sin(0.3) * 1.05, -Math.sin(0.3) * 1.05, Math.cos(0.3) * 1.05, 90, -20], 'linear'],
    ['half', [0.55, 0, 0, 0.55, 100.27, 120.27], 'linear'], // smaller than the pages: mipmaps (edges off the pixel centres)
    ['nearest', [1.5, 0, 0, 1.5, 4, 2], 'nearest'],
  ];
  for (const [name, m, sampling] of cases) {
    inst.setTransform(...m); inst.reset(); inst.update(0);
    const c = cPicture(sampling === 'nearest');
    const g = glPicture(images, sampling);
    out[`${name} webgl2`] = { ...compare(g.px, c), draws: g.draws };
    if (device) { const w = await gpuPicture(images, sampling); out[`${name} webgpu`] = { ...compare(w.px, c), draws: w.draws }; }
  }
  // the smallest page drawn at about a third: mipmaps; its far edges must stay opaque (the padding next to the page
  // in the texture array is transparent, and must not be mixed in)
  {
    inst.setTransform(0.5, 0, 0, 0.5, 0, 0); inst.reset(); inst.update(0); // g: pixels 400..431, edges on pixel boundaries
    const c = cPicture(false), g = glPicture(images, 'linear').px, w = device ? (await gpuPicture(images, 'linear')).px : null;
    const edge = (px) => { let min = 255; for (let k = 400; k < 432; k++) min = Math.min(min, px[4 * (431 * W + k) + 3], px[4 * (k * W + 431) + 3]); return min; };
    out.farEdge = { c: edge(c), webgl2: edge(g), webgpu: w ? edge(w) : null };
  }
  // the check can tell the pages apart: the same pages in another order draw another picture
  inst.setTransform(1, 0, 0, 1, 20, 20); inst.reset(); inst.update(0);
  const c = cPicture(false), shuffled = [images[1], images[2], images[0]];
  out.shuffled = compare(glPicture(shuffled, 'linear').px, c);
  if (device) out.shuffledGpu = compare((await gpuPicture(shuffled, 'linear')).px, c);
  out.gpuErrors = gpuErrors;
  return out;
};
window.ready = true;
</script>
