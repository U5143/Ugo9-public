<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ugo9 in Phaser</title>
<script type="importmap">{ "imports": { "phaser": "https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.esm.min.js" } }</script>
</head><body>
<div id="view"></div>
<div id="panel"><h1>Ugo9 × Phaser</h1></div>
<script type="module">
// Ugo9 in Phaser: the sample character in a scene (web/ugo_phaser.js), with the shared panel.
import * as PhaserModule from 'phaser';
import { UgoRuntime, loadImage } from '../ugo.js';
import { UgoLayer } from '../ugo_layer.js';
import { UgoPhaserLayer } from '../ugo_phaser.js';
import { makePanel, PANEL_CSS } from './playground.js';

const Phaser = PhaserModule.default ?? PhaserModule;
document.head.append(Object.assign(document.createElement('style'), { textContent: PANEL_CSS }));
const W = 640, H = 600;
const rt = await UgoRuntime.load();
const model = rt.loadModel(await (await fetch('../../samples/basic/model.ug9')).arrayBuffer());
const atlas = await loadImage('../../samples/basic/atlas.png');
const panel = makePanel(document.getElementById('panel'), model);

let ugo, hero, seconds = 0;
const game = new Phaser.Game({
  type: Phaser.WEBGL, width: W, height: H, backgroundColor: '#e9e6dc', parent: 'view', banner: false,
  render: { preserveDrawingBuffer: true },
  scene: {
    create() {
      this.add.circle(W / 2, H * 0.42, 210, 0xd8d2c0); // Phaser's own object behind the character
      const layer = new UgoLayer(rt, { width: W, height: H });
      const kind = layer.addModel(model, [atlas]);
      hero = layer.add(kind, { x: W / 2, y: H - 10, scale: (H - 20) / model.canvas[1] });
      ugo = new UgoPhaserLayer(this, layer);
      this.input.on('pointerdown', (p) => panel.showPick(ugo.pick(p.worldX, p.worldY)?.name ?? null));
      window.ugoTest = { game, ugo, layer, hero, panel, model };
      window.ready = true;
    },
    update(time, delta) {
      const dt = Math.min(0.1, delta / 1000);
      seconds += dt;
      hero.instance.reset();
      panel.apply(hero.instance, dt, seconds);
      ugo.update(dt);
    },
  },
});
</script>
</body></html>
