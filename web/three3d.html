<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ugo9 3D</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<style>
  :root { --bg: #dfe6ee; --panel: #fffffff0; --ink: #1f2430; --muted: #5f6676; --line: #d2d8e2; --accent: #5b3fa0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151820; --panel: #1f2330f0; --ink: #e8ebf2; --muted: #9aa1b2; --line: #313748; --accent: #a58ce6; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; max-width: min(320px, calc(100vw - 48px)); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .stats { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>Ugo9 を 3D の場面に置く</h1>
  <p>2D のキャラを 3D の中に置き、Ugo9 のまま動かします（表情・揺れ物・透けも全部）。ドラッグで見回し、ホイールで近づきます。</p>
  <label><input type="checkbox" id="bb" checked> いつもカメラを向く</label>
  <label>キャラの数 <input type="range" id="n" min="1" max="200" value="24"><span id="nOut">24</span></label>
  <label><input type="checkbox" id="walk" checked> 歩き回る</label>
  <div class="stats" id="stats"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { UgoRuntime, loadImage } from './ugo.js';
import { UgoThreeCharacterFactory } from './ugo_three.js';

const $ = (id) => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ee);
scene.fog = new THREE.Fog(0xdfe6ee, 18, 45);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(6, 4, 10);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1, 0);
controls.enableDamping = true;

// a simple stage: floor, a few blocks, light for them (the characters are unlit 2D art)
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 10, 4);
scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0xc9d3de }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
scene.add(new THREE.GridHelper(60, 60, 0xaab4c2, 0xbcc5d1));
const blockColors = [0x7a8fc7, 0xd59a6a, 0x7fbf9a, 0xc78ab4];
for (let i = 0; i < 9; i++) {
  const h = 0.6 + (i % 3) * 0.7;
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, h, 1.4), new THREE.MeshStandardMaterial({ color: blockColors[i % 4] }));
  const a = (i / 9) * Math.PI * 2;
  b.position.set(Math.cos(a) * 7, h / 2, Math.sin(a) * 7);
  scene.add(b);
}

// characters
const rt = await UgoRuntime.load();
const model = rt.loadModel(await (await fetch('../samples/basic/model.ug9')).arrayBuffer());
const factory = new UgoThreeCharacterFactory(THREE, model, new THREE.Texture(await loadImage('../samples/basic/atlas.png')));
const mpp = 1.6 / model.canvas[1]; // the model's canvas is 1.6 m tall
const chars = [];
function setCount(n) {
  while (chars.length < n) {
    const c = factory.create({ metresPerPixel: mpp, billboard: $('bb').checked });
    c.walk = { r: 2 + Math.random() * 4, a: Math.random() * Math.PI * 2, speed: (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.2), t: Math.random() * 6 };
    scene.add(c);
    chars.push(c);
  }
  while (chars.length > n) scene.remove(chars.pop());
}
setCount(24);
$('n').oninput = () => { $('nOut').textContent = $('n').value; setCount(Number($('n').value)); };
$('bb').onchange = () => chars.forEach((c) => { c.ugo.material.uniforms.uBillboard.value = $('bb').checked; });

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

let last = performance.now(), fps = 60, statT = 0;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  fps = fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
  const t0 = performance.now();
  for (const c of chars) {
    const w = c.walk;
    w.t += dt;
    if ($('walk').checked) w.a += w.speed * dt;
    c.position.set(Math.cos(w.a) * w.r, 0, Math.sin(w.a) * w.r);
    c.instance.reset();
    c.instance.play('idle', w.t);
    c.place(); // swaying chains feel the walk
    c.instance.update(dt);
    c.sync(renderer);
  }
  const cpu = performance.now() - t0;
  controls.update();
  renderer.render(scene, camera);
  statT += dt;
  if (statT > 0.5) {
    statT = 0;
    $('stats').textContent = `${fps.toFixed(0)} fps ・ キャラの計算 ${cpu.toFixed(2)} ms ・ 描画 ${renderer.info.render.calls} 回`;
  }
});
</script>
</body>
</html>
